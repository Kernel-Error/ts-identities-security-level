[workspace]
resolver = "2"
members = [
    "crates/ts3level-core",
    "crates/ts3level-engine",
    "crates/ts3level-cuda",
    "crates/ts3level-cli",
    "crates/ts3level-gui",
    "xtask",
]

[workspace.package]
version      = "0.3.0"
edition      = "2021"
rust-version = "1.82"
license      = "MIT"
authors      = ["Sebastian van de Meer aka Kernel-Error <kernel-error@kernel-error.com>"]
repository   = "https://github.com/kernel-error/ts-identities-security-level"
homepage     = "https://www.kernel-error.de"

[workspace.dependencies]
anyhow             = "1.0"
thiserror          = "2.0"
sha1               = "0.10"
base64             = "0.22"
tempfile           = "3.10"
rustix             = { version = "0.38", features = ["fs"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = 3
