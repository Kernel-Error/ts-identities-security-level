name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older in-flight run as soon as a newer push comes in.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 + libadwaita + gettext dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev gettext pkg-config

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
          non-cuda-sub-packages: '[]'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - run: cargo clippy --workspace --all-targets --release

  test:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 + libadwaita + gettext + locales
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev gettext pkg-config locales
          sudo locale-gen en_US.UTF-8 de_DE.UTF-8 es_ES.UTF-8 fr_FR.UTF-8 nl_NL.UTF-8

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'
          non-cuda-sub-packages: '[]'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci

      - name: Compile translations
        run: cargo run -p xtask --release -- msgfmt

      - name: Run tests
        # GPU-bound tests self-skip on runners without /dev/nvidiactl, so
        # the suite finishes with success even though some tests print a
        # "no CUDA device; skipping" note.
        env:
          TS3LEVEL_LOCALEDIR: ${{ github.workspace }}/target/locale
        run: cargo test --workspace --release
